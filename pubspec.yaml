name: campus_lunch
description: 캠퍼스런치 - 실시간 교내 식당 혼잡도 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  app_links: ^6.4.0
  go_router: ^14.2.7
  flutter_svg: ^2.0.10+1
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  kakao_maps_flutter:
    path: packages/kakao_maps_flutter
  http: ^1.6.0
  geolocator: ^14.0.2
  permission_handler: ^11.4.0
  kakao_flutter_sdk_user: ^1.10.0
  kakao_flutter_sdk_share: ^1.10.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  image: ^4.5.4
  charset: ^2.0.1
  gal: ^2.3.2
  path_provider: ^2.1.5
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  supabase: ^2.10.6
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_source.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icon/
    - assets/config/
    - assets/legal/
    - .env
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900
