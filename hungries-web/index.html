<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hungries — 헝그리즈</title>
    <meta
      name="description"
      content="Hungries(헝그리즈) — 모바일 앱을 만드는 팀. Campus Lunch 등."
    />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" type="image/png" href="/assets/app-icon.png" />
    <link rel="apple-touch-icon" href="/assets/app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">본문으로 건너뛰기</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="/">
          <img src="/assets/app-icon.png" alt="" width="34" height="34" />
          <span>hungries</span>
        </a>
        <nav class="nav" aria-label="주요">
          <a href="#product">제품</a>
          <a href="#contact" class="nav-cta">문의</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="hero">
        <div class="wrap hero-grid">
          <div class="hero-copy">
            <h1 class="reveal">hungries</h1>
            <p class="lede reveal">헝그리즈 · 모바일 앱을 만드는 팀</p>
            <div class="hero-actions reveal">
              <a class="btn primary" href="#contact">문의하기</a>
            </div>
          </div>
          <div class="hero-panel reveal" aria-hidden="true">
            <p class="hero-panel-text">hungries</p>
          </div>
        </div>
      </section>

      <section id="product" class="section quiet">
        <div class="wrap narrow">
          <h2 class="reveal">제품</h2>
          <article class="product-card reveal">
            <h3>Campus Lunch <em>캠퍼스런치</em></h3>
            <p>
              대학가 식당 혼잡도 정보를 제공하는 iOS·Android 앱입니다.
            </p>
          </article>
        </div>
      </section>

      <section id="contact" class="section">
        <div class="wrap narrow">
          <h2 class="reveal">문의</h2>
          <a class="mail-btn reveal" href="mailto:contact@hungries.site"
            >contact@hungries.site</a
          >
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p class="footer-brand">© <span id="year"></span> Hungries (헝그리즈)</p>
        <p class="footer-legal">
          대표 임동하·권가은 · 서울특별시 금천구 시흥대로141길 8(독산동)<br />
          <a href="mailto:contact@hungries.site">contact@hungries.site</a>
          ·
          <a href="https://hungries.site">hungries.site</a>
        </p>
      </div>
    </footer>

    <script src="/main.js"></script>
  </body>
</html>
